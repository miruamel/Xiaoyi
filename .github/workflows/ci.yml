name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

env:
  RUST_VERSION: '1.99-nightly'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  # ============================================================
  # RUST: Check, Test, Clippy, Audit, Build
  # ============================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cd src/rust
          cargo fmt --workspace -- --check

      - name: Run Clippy
        run: |
          cd src/rust
          cargo clippy --features python,nodejs -- -D warnings

      - name: Run cargo check
        run: |
          cd src/rust
          cargo check --features python,nodejs

      - name: Run tests
        run: |
          cd src/rust
          cargo test --features python,nodejs -- --test-threads=4

      - name: Install cargo-audit
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-audit
          version: latest

      - name: Security audit (cargo-audit)
        run: |
          cd src/rust
          cargo audit

      - name: Security audit (cargo-deny)
        run: |
          cargo install cargo-deny
          cd src/rust
          cargo deny check advisories

      - name: Build release
        run: |
          cd src/rust
          cargo build --release --features python,nodejs

  # ============================================================
  # CROSS-LANGUAGE: Integration Tests (Rust crate with bindings)
  # ============================================================
  integration:
    name: Cross-Language Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.lock') }}

      - name: Build Rust with Python bindings
        run: |
          cd src/rust
          cargo build --release --features python

      - name: Test Python bindings via maturin
        run: |
          pip install -U pip maturin
          cd src/rust
          maturin develop --release -m Cargo.toml
          python -c "
          import xiaoyi
          from xiaoyi.core.error import ErrorKind, create_error
          from xiaoyi.core.result import ok, err, is_ok, is_err, unwrap
          
          # Test error creation
          e = create_error(ErrorKind.CONFIG, 'test error', {'key': 'value'})
          assert e.kind == ErrorKind.CONFIG
          assert e.message == 'test error'
          assert e.meta['key'] == 'value'
          print('Error test passed')
          
          # Test result
          r = ok(42)
          assert is_ok(r)
          assert unwrap(r) == 42
          print('Result test passed')
          
          print('All Python binding tests passed!')
          "

      - name: Build Rust with Node.js bindings
        if: runner.os != 'Linux' || runner.arch != 'arm64'
        run: |
          cd src/rust
          cargo build --release --features nodejs

  # ============================================================
  # DEPENDENCY REVIEW (PR only)
  # ============================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review.yml'
          fail-on-severity: high

  # ============================================================
  # RELEASE (on tag push)
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [rust, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build Rust release
        run: |
          cd src/rust
          cargo build --release --features python,nodejs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            src/rust/target/release/libxiaoyi.*