name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

env:
  RUST_VERSION: '1.82'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================
  # RUST: Check, Test, Clippy, Audit, Build
  # ============================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cd src/rust
          cargo fmt --workspace -- --check

      - name: Run Clippy
        run: |
          cd src/rust
          cargo clippy --features python,nodejs -- -D warnings

      - name: Run cargo check
        run: |
          cd src/rust
          cargo check --features python,nodejs

      - name: Run tests
        run: |
          cd src/rust
          cargo test --features python,nodejs -- --test-threads=4

      - name: Install cargo-audit
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-audit
          version: latest

      - name: Security audit (cargo-audit)
        run: |
          cd src/rust
          cargo audit

      - name: Security audit (cargo-deny)
        run: |
          cargo install cargo-deny
          cd src/rust
          cargo deny check advisories

      - name: Build release
        run: |
          cd src/rust
          cargo build --release --features python,nodejs

  # ============================================================
  # TYPESCRIPT: Lint, Type-check, Test, Audit, Build
  # ============================================================
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  # ============================================================
  # PYTHON: Lint, Type-check, Test, Audit, Import check
  # ============================================================
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov ruff mypy pip-audit

      - name: Run Ruff (lint)
        run: ruff check xiaoyi/

      - name: Run Ruff (format check)
        run: ruff format --check xiaoyi/

      - name: Run mypy (type check)
        run: mypy xiaoyi/ --strict --ignore-missing-imports

      - name: Run tests
        run: pytest xiaoyi/ -v --cov=xiaoyi --cov-report=term-missing

      - name: Security audit (pip-audit)
        run: pip-audit

      - name: Import check
        run: python -c "import xiaoyi; print('Import OK')"

  # ============================================================
  # CROSS-LANGUAGE: Integration Tests
  # ============================================================
  integration:
    name: Cross-Language Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust, typescript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.lock') }}

      - name: Build Rust with Python bindings
        run: |
          cd src/rust
          cargo build --release --features python

      - name: Install Python bindings
        run: |
          cd src/python
          pip install -U pip maturin
          maturin develop --release -m ../rust/Cargo.toml

      - name: Run cross-language test
        run: |
          cd src/python
          python -c "
          import xiaoyi
          from xiaoyi.core.error import ErrorKind, create_error
          from xiaoyi.core.result import ok, err, is_ok, is_err, unwrap
          
          # Test error creation
          e = create_error(ErrorKind.CONFIG, 'test error', {'key': 'value'})
          assert e.kind == ErrorKind.CONFIG
          assert e.message == 'test error'
          assert e.meta['key'] == 'value'
          print('Error test passed')
          
          # Test result
          r = ok(42)
          assert is_ok(r)
          assert unwrap(r) == 42
          print('Result test passed')
          
          print('All cross-language tests passed!')
          "

      - name: Build Rust with Node.js bindings
        run: |
          cd src/rust
          cargo build --release --features nodejs

      - name: Test Node.js bindings
        run: |
          cd src/typescript
          npm ci
          npm run build

  # ============================================================
  # DEPENDENCY REVIEW (PR only)
  # ============================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review.yml'
          fail-on-severity: high

  # ============================================================
  # RELEASE (on tag push)
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [rust, typescript, python, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build Rust release
        run: |
          cd src/rust
          cargo build --release --features python,nodejs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish TypeScript
        run: |
          cd src/typescript
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build and publish Python
        run: |
          cd src/python
          pip install -U pip build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            src/rust/target/release/libxiaoyi.*
            src/typescript/dist/*
            src/python/dist/*