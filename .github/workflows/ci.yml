name: Xiaoyi CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_VERSION: "1.75"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets

  python:
    name: Python (SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest -v --cov=xiaoyi --cov-report=xml

  typescript:
    name: TypeScript (SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  # Cross-language integration test
  integration:
    name: Cross-language Integration
    runs-on: ubuntu-latest
    needs: [rust, python, typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Run integration smoke test
        run: |
          echo "Integration tests would run here"
          # cargo run --example cross_lang --manifest-path rust/Cargo.toml
          # python -m xiaoyi.integration_test
          # npm run test:integration --prefix ts

  # Release on tag push
  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, python, typescript]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true