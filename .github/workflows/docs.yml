name: Deploy Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/rust/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build Rust documentation
        run: |
          cd src/rust
          cargo doc --all-features --no-deps --document-private-items

      - name: Generate TypeScript documentation
        run: |
          cd src/typescript
          npm ci
          npm run docs || echo "No docs script, skipping"

      - name: Generate Python documentation
        run: |
          cd src/python
          pip install -U pip pdoc
          pdoc -o ../../docs/api/python xiaoyi || echo "pdoc failed, skipping"

      - name: Copy docs to deployment directory
        run: |
          mkdir -p _site
          cp -r src/rust/target/doc/* _site/
          if [ -d "docs/api/python" ]; then
            cp -r docs/api/python _site/python
          fi
          if [ -d "src/typescript/docs" ]; then
            cp -r src/typescript/docs _site/typescript
          fi

      - name: Add custom index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Xiaoyi - API Documentation</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 2rem; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
              .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 1.5rem; transition: box-shadow 0.2s; }
              .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
              .card h2 { margin-top: 0; color: #0366d6; }
              .card a { text-decoration: none; color: inherit; }
              .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.875rem; font-weight: 600; }
              .badge-rust { background: #fef3c7; color: #92400e; }
              .badge-ts { background: #dbeafe; color: #1e40af; }
              .badge-py { background: #dcfce7; color: #166534; }
            </style>
          </head>
          <body>
            <h1>Xiaoyi API Documentation</h1>
            <p>Polyglot AI Agent Framework with Deep Vertical Architecture</p>
            <div class="grid">
              <a href="xiaoyi/index.html" class="card">
                <span class="badge badge-rust">Rust</span>
                <h2>Rust Core API</h2>
                <p>Core runtime, LLM clients, workflow engine, memory systems, and orchestration</p>
              </a>
              <a href="python/index.html" class="card">
                <span class="badge badge-py">Python</span>
                <h2>Python SDK</h2>
                <p>AI/ML ecosystem integration with async support</p>
              </a>
              <a href="typescript/index.html" class="card">
                <span class="badge badge-ts">TypeScript</span>
                <h2>TypeScript SDK</h2>
                <p>Web/Edge runtime with full type safety</p>
              </a>
            </div>
            <hr style="margin: 3rem 0;">
            <p style="color: #6a737d; font-size: 0.875rem;">
              Generated on <script>document.write(new Date().toLocaleString())</script> ·
              <a href="https://github.com/miruamel/Xiaoyi">View on GitHub</a>
            </p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4