[package]
name = "xiaoyi-basic-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
xiaoyi = { path = "../../../src/rust", features = ["python"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
serde_json = "1.0"

[[bin]]
name = "basic-agent"
path = "main.rs"