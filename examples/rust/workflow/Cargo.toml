[package]
name = "xiaoyi-workflow"
version = "0.1.0"
edition = "2021"

[dependencies]
xiaoyi = { path = "../../../src/rust", features = ["python"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "workflow"
path = "main.rs"