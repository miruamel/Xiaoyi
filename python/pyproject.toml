[project]
name = "xiaoyi-py"
version = "0.1.0"
description = "Xiaoyi polyglot framework - Python SDK with deep vertical architecture"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Miruamel" }]
keywords = ["ai", "llm", "agent", "workflow", "framework"]
dependencies = [
  "pydantic>=2.7",
  "typing-extensions>=4.9",
  "aiohttp>=3.9",
  "grpcio>=1.62",
  "protobuf>=4.25",
  "langgraph>=0.2",
  "langchain-core>=0.2",
  "sqlalchemy>=2.0",
  "redis>=5.0",
  "httpx>=0.26",
  "tenacity>=8.2",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
test = ["pytest>=8.2", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
