[package]
name = "xiaoyi"
version = "0.1.0"
edition = "2024"
description = "Xiaoyi AI Agent Framework - Core Runtime"
authors = ["Miruamel"]
license = "MIT"
repository = "https://github.com/miruamel/Xiaoyi"
readme = "../../README.md"

[lib]
name = "xiaoyi"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python", "nodejs"]
python = ["pyo3"]
nodejs = ["napi", "napi-derive"]
napi-derive = ["dep:napi-derive"]

[dependencies]
# Core
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }

# Config
config = "0.15"
toml = "1.1"
yaml-rust2 = "0.11"
serde_yaml = "0.9"
base64 = "0.23"

# Crypto
aes-gcm = "0.11"
pbkdf2 = "0.13"
rand = "0.10"
zeroize = "1.6"
sha2 = "0.11"

# Graph
petgraph = "0.8"
indexmap = "2.0"

# LLM
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls", "rustls-tls-webpki-roots"] }
async-openai = "0.20"

# Memory
parking_lot = "0.12"
lru = "0.10"

# Python bindings (PyO3)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
# Node.js bindings (napi-rs)
napi = { version = "2", optional = true }
napi-derive = { version = "2", optional = true }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1.4"

# Nightly features
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 2
overflow-checks = true

[lints.clippy]
# Correctness
correctness = { level = "deny", priority = -1 }
# Style
pedantic = { level = "warn", priority = -1 }
# Restriction lints — opt-in
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Allow these (common in async/no_std contexts)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
