# Clippy configuration for xiaoyi
# See https://github.com/rust-lang/rust-clippy/master/clippy_toml.md

# Lints to allow (reduce noise)
allow = [
    "type_complexity",           # Some types are intentionally complex
    "too_many_arguments",        # Builder patterns need many args
    "large_enum_variant",        # Some enum variants are large
    "enum_variant_names",        # Variant naming is intentional
    "module_name_repetitions",   # Module names repeat type names intentionally
    "missing_docs_in_private_items",  # Private items don't need docs
    "single_match_else",         # Match with single else is fine
    "needless_pass_by_value",    # Some APIs need owned values
]

# Lints to warn on
warn = [
    "pedantic",
    "nursery",
    "cargo",
    "perf",
    "style",
    "correctness",
    "complexity",
    "suspicious",
]

# Lints to deny (errors)
deny = [
    "missing_docs",              # Public API must be documented
    "unused_imports",            # Clean imports
    "unused_variables",          # Clean variables
]

# Additional clippy options
[clippy::pedantic]
# Don't require docs on private items
missing_docs_in_private_items = "allow"

# Don't warn on type complexity
type_complexity = "allow"

[clippy::nursery]
# All nursery lints are warnings by default